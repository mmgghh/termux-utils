[project]
name = "termux-toolbox"
version = "0.1.0"
description = "A CLI toolbox exposing Termux:API device capabilities."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "mohammad", email = "mmggwwoorrkk@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
]

[project.urls]
Homepage = "https://github.com/mmgghh/termux-utils"
Repository = "https://github.com/mmgghh/termux-utils"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mgt = "termux_toolbox.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
